name: Self-hosted stack smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Self-hosted stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Generate disposable integration secrets
        shell: bash
        run: |
          set -euo pipefail
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'BACKUP_PASSPHRASE=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Run platform smoke and automation
        shell: pwsh
        run: |
          .\scripts\smoke-phase2.ps1 -BaseUri 'http://127.0.0.1:5090' -BackupPassphrase $env:BACKUP_PASSPHRASE
          .\scripts\smoke-phase2-automation.ps1 -BaseUri 'http://127.0.0.1:5090'
          .\scripts\test-phase2-restore.ps1 -SourceBaseUri 'http://127.0.0.1:5090' -PostgresPassword $env:POSTGRES_PASSWORD -BackupPassphrase $env:BACKUP_PASSPHRASE

      - name: Show service state after failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Remove disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
