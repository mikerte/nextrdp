name: Self-hosted stack smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Self-hosted stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build automation CLI
        run: dotnet build ./src/NextRdp.Cli/NextRdp.Cli.csproj --configuration Release

      - name: Generate disposable integration secrets
        shell: bash
        run: |
          set -euo pipefail
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'BACKUP_PASSPHRASE=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Run platform smoke and automation
        shell: pwsh
        run: |
          .\scripts\smoke-phase2.ps1 -BaseUri 'http://127.0.0.1:5090' -BackupPassphrase $env:BACKUP_PASSPHRASE
          .\scripts\smoke-phase2-automation.ps1 -BaseUri 'http://127.0.0.1:5090'
          .\scripts\test-phase2-restore.ps1 -SourceBaseUri 'http://127.0.0.1:5090' -PostgresPassword $env:POSTGRES_PASSWORD -BackupPassphrase $env:BACKUP_PASSPHRASE

      - name: Show service state after failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Remove disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
