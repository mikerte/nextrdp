name: Windows validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/NextRdp.Admin/package-lock.json

      - name: Restore administration-console dependencies
        working-directory: src/NextRdp.Admin
        run: npm ci

      - name: Check Developer Certificate of Origin
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .\scripts\check-dco.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA

      - name: Check public source boundary
        shell: pwsh
        run: .\scripts\check-public-tree.ps1

      - name: Run Phase 2 release validation
        shell: pwsh
        run: .\scripts\check-phase2.ps1 -Configuration Release

      - name: Build and verify test-signed MSIX
        shell: pwsh
        run: |
          .\scripts\publish-windows.ps1 -Configuration Release
          .\scripts\package-msix.ps1
