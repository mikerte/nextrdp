version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    groups:
      dotnet-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /src/NextRdp.Admin
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    groups:
      admin-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directories:
      - /
      - /src/NextRdp.Admin
      - /src/NextRdp.ControlPlane
    schedule:
      interval: weekly
      day: monday
      time: '04:45'
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    groups:
      container-images:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
